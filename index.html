<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#09090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VibeChat</title>

<!-- MQTT Client with automatic dual-CDN fallback -->
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js" onerror="loadMqttFallback()"></script>
<script>
function loadMqttFallback() {
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
  s.onload = function(){ if (window.initMqttWhenReady) window.initMqttWhenReady(); };
  document.head.appendChild(s);
}
</script>

<style>
:root {
  --bg: #08080e;
  --bg-elev: #11111c;
  --glass: rgba(20, 20, 34, 0.86);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text: #f4f4f9;
  --muted: #8e90a6;
  --accent1: #7c3aed;
  --accent2: #2563eb;
  --neon: #00e5ff;
  --green: #22c55e;
  --danger: #ef4444;
  --sent-grad: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
  --recv-bg: #171826;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  user-select: none;
}

#app {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
}

.screen {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.25s ease, opacity 0.22s ease;
  background: var(--bg);
}
.screen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateX(30px);
}
#homeScreen.slide-left {
  transform: translateX(-25%);
  opacity: 0.4;
  pointer-events: none;
}
#chatScreen.hidden {
  transform: translateX(100%);
  opacity: 1;
}

.header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--glass-border);
  min-height: 62px;
  z-index: 10;
}
.brand {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(90deg, #a78bfa, #00e5ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.conn-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border);
  color: var(--muted);
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #f59e0b;
  box-shadow: 0 0 8px #f59e0b;
}
.dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

.spacer { flex: 1; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.06);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.12s, background 0.15s;
}
.icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.14); }

.search-wrap {
  flex-shrink: 0;
  padding: 10px 14px 6px;
}
.search-input {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.search-input:focus { border-color: rgba(124,58,237,0.6); }

.chat-list {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  padding: 6px 10px 90px;
}
.chat-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 12px;
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  margin-bottom: 4px;
}
.chat-item:active {
  background: rgba(255,255,255,0.07);
  transform: scale(0.99);
}
.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: 700;
  flex-shrink: 0;
  position: relative;
  background: linear-gradient(135deg, #6d28d9, #2563eb);
  box-shadow: 0 4px 14px rgba(124,58,237,0.28);
}
.avatar.sm { width: 40px; height: 40px; font-size: 18px; }
.avatar .online-ring {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--green);
  border: 2px solid var(--bg);
  display: none;
}
.avatar.has-online .online-ring { display: block; }

.chat-meta { flex: 1; min-width: 0; }
.chat-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}
.chat-name {
  font-size: 15.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-time {
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
  margin-left: 8px;
}
.chat-bottom-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.chat-preview {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.unread-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: linear-gradient(135deg, #7c3aed, #00e5ff);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--muted);
}
.empty-icon {
  font-size: 52px;
  margin-bottom: 14px;
  filter: drop-shadow(0 0 18px rgba(124,58,237,0.45));
}
.empty-state h3 { color: var(--text); margin-bottom: 8px; font-size: 18px; }
.empty-state p { font-size: 13.5px; line-height: 1.5; max-width: 280px; margin: 0 auto 20px; }

.fab {
  position: absolute;
  bottom: 22px;
  right: 20px;
  width: 58px;
  height: 58px;
  border-radius: 18px;
  border: none;
  background: var(--sent-grad);
  color: #fff;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 28px rgba(124,58,237,0.5);
  cursor: pointer;
  z-index: 20;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

.chat-header-info { flex: 1; min-width: 0; }
.chat-header-name {
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-header-sub {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-header-sub.typing { color: var(--neon); font-weight: 600; }
.chat-header-sub.online { color: var(--green); }

/* FIXED SCROLL CONTAINER FOR ANDROID WEBVIEW */
.messages-outer {
  position: relative;
  flex: 1 1 0%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.messages-wrap {
  display: block;
  flex: 1 1 0%;
  min-height: 0;
  height: 100%;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  padding: 14px 12px 22px;
  background-image:
    radial-gradient(rgba(124,58,237,0.06) 1px, transparent 1px),
    radial-gradient(rgba(0,229,255,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
}

.messages-inner {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.scroll-down-btn {
  position: absolute;
  right: 14px;
  bottom: 14px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.4);
  background: rgba(20, 20, 36, 0.92);
  color: var(--neon);
  font-size: 18px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  cursor: pointer;
  z-index: 15;
}
.scroll-down-btn.show { display: flex; }

.sys-pill {
  flex-shrink: 0;
  align-self: center;
  font-size: 11.5px;
  color: var(--muted);
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border);
  padding: 6px 13px;
  border-radius: 14px;
  margin: 4px 0 8px;
  text-align: center;
  line-height: 1.45;
}

.msg-row {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  max-width: 82%;
  position: relative;
}
.msg-row.me { align-self: flex-end; align-items: flex-end; }
.msg-row.them { align-self: flex-start; align-items: flex-start; }

.msg-sender {
  font-size: 11px;
  color: #a78bfa;
  font-weight: 600;
  margin: 0 0 3px 8px;
}

.bubble {
  position: relative;
  padding: 9px 13px 7px;
  border-radius: 18px;
  font-size: 14.8px;
  line-height: 1.42;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  user-select: text;
}
.msg-row.me .bubble {
  background: var(--sent-grad);
  color: #fff;
  border-bottom-right-radius: 5px;
  box-shadow: 0 4px 16px rgba(59,130,246,0.22);
}
.msg-row.them .bubble {
  background: var(--recv-bg);
  color: var(--text);
  border: 1px solid var(--glass-border);
  border-bottom-left-radius: 5px;
}

.reply-quote {
  background: rgba(0,0,0,0.28);
  border-left: 3px solid var(--neon);
  border-radius: 8px;
  padding: 5px 8px;
  margin-bottom: 6px;
  font-size: 12px;
}
.reply-quote .rq-name { font-weight: 700; color: var(--neon); font-size: 11px; }
.reply-quote .rq-text { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

.msg-img {
  max-width: 230px;
  max-height: 260px;
  border-radius: 12px;
  display: block;
  margin-bottom: 5px;
  cursor: pointer;
  object-fit: cover;
}

.msg-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 3px;
  font-size: 10.5px;
  opacity: 0.8;
}
.ticks { font-weight: 700; letter-spacing: -2px; margin-right: 2px; }
.ticks.delivered { color: #67e8f9; }

.react-pill {
  position: absolute;
  bottom: -11px;
  right: 8px;
  background: #1d1e30;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 13px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.45);
  display: flex;
  gap: 3px;
}
.msg-row.them .react-pill { right: auto; left: 8px; }
.msg-row.has-react { margin-bottom: 10px; }

.typing-indicator {
  flex-shrink: 0;
  display: none;
  align-self: flex-start;
  background: var(--recv-bg);
  border: 1px solid var(--glass-border);
  padding: 10px 14px;
  border-radius: 16px;
  border-bottom-left-radius: 4px;
  gap: 5px;
  align-items: center;
}
.typing-indicator.show { display: flex; }
.t-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--neon);
  animation: bounce 1.2s infinite ease-in-out;
}
.t-dot:nth-child(2) { animation-delay: 0.18s; }
.t-dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-5px); opacity: 1; }
}

.reply-banner {
  flex-shrink: 0;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: #141422;
  border-top: 1px solid var(--glass-border);
  border-left: 3px solid var(--neon);
}
.reply-banner.show { display: flex; }
.rb-info { flex: 1; min-width: 0; }
.rb-title { font-size: 11.5px; font-weight: 700; color: var(--neon); }
.rb-text { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.emoji-bar {
  flex-shrink: 0;
  display: none;
  padding: 8px 10px;
  background: #12121f;
  border-top: 1px solid var(--glass-border);
  gap: 6px;
  overflow-x: auto;
}
.emoji-bar.show { display: flex; }
.emoji-btn {
  font-size: 22px;
  background: none;
  border: none;
  padding: 4px 6px;
  border-radius: 10px;
  cursor: pointer;
}
.emoji-btn:active { background: rgba(255,255,255,0.12); transform: scale(1.15); }

.composer {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 9px 10px;
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--glass-border);
}
.input-box {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--bg-elev);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 4px 8px 4px 12px;
  min-height: 44px;
}
.input-box:focus-within { border-color: rgba(124,58,237,0.7); }
#msgInput {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 15px;
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.35;
  padding: 6px 0;
  font-family: inherit;
}
.send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--sent-grad);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(124,58,237,0.45);
  transition: transform 0.12s;
}
.send-btn:active { transform: scale(0.9); }

.modal-backdrop {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 100;
}
.modal-backdrop.show { display: flex; }
.modal {
  width: 100%;
  max-width: 390px;
  background: #131322;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px;
  padding: 22px 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.modal h2 { font-size: 20px; margin-bottom: 6px; }
.modal p.sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.45; }

.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin: 12px 0 6px;
}
.field-input {
  width: 100%;
  background: #0b0b14;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 11px 13px;
  color: var(--text);
  font-size: 15px;
  outline: none;
}
.field-input:focus { border-color: var(--neon); }

.row-gap { display: flex; gap: 8px; align-items: center; }

.btn {
  width: 100%;
  padding: 12px 16px;
  border-radius: 13px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 14px;
  transition: transform 0.12s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--sent-grad); color: #fff; box-shadow: 0 6px 20px rgba(124,58,237,0.35); }
.btn-ghost { background: rgba(255,255,255,0.08); color: var(--text); }
.btn-sm { width: auto; margin-top: 0; padding: 11px 13px; font-size: 13px; white-space: nowrap; }

.avatar-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.av-opt {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 2px solid transparent;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.av-opt.active { border-color: var(--neon); background: rgba(0,229,255,0.14); }

.msg-menu {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 120;
  padding: 16px;
}
.msg-menu.show { display: flex; }
.msg-menu-box {
  width: 100%;
  max-width: 420px;
  background: #161627;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 14px;
}
.quick-reacts {
  display: flex;
  justify-content: space-around;
  padding-bottom: 12px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--glass-border);
}
.qr-btn {
  font-size: 26px;
  background: rgba(255,255,255,0.06);
  border: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  cursor: pointer;
}
.qr-btn:active { transform: scale(1.2); }
.menu-action {
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 15px;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.menu-action:active { background: rgba(255,255,255,0.08); }

.lightbox {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0,0,0,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; }

.toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1f2035;
  color: #fff;
  border: 1px solid rgba(0,229,255,0.35);
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: all 0.22s ease;
  z-index: 300;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <section id="homeScreen" class="screen">
    <div class="header">
      <div class="brand">VibeChat</div>
      <div class="conn-pill" id="connPill">
        <span class="dot" id="connDot"></span>
        <span id="connText">Connecting</span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound" onclick="toggleSound()">🔔</button>
      <button class="icon-btn" id="profileBtn" title="Profile" onclick="openProfileModal(false)">👤</button>
    </div>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="Search chats..." oninput="renderChatList()">
    </div>

    <div class="chat-list" id="chatList"></div>

    <button class="fab" onclick="openNewChatModal()" title="New Chat / Join Room">＋</button>
  </section>

  <section id="chatScreen" class="screen hidden">
    <div class="header">
      <button class="icon-btn" onclick="closeChat()" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="avatar sm" id="chatAvatar">💬<span class="online-ring"></span></div>
      <div class="chat-header-info">
