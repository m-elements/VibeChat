name: VibeChat Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build VibeChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android Project
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/vibechat/app/MainActivity.java

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug
