name: VibeChat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build VibeChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Project
        run: |

          mkdir -p android/app/src/main/java/com/vibechat/app
          mkdir -p android/app/src/main/res/drawable

          cp 1795404380602.png android/app/src/main/res/drawable/vibechat_logo.png

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VibeChat"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vibechat.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vibechat.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false"/>

              <uses-feature
                  android:name="android.hardware.microphone"
                  android:required="false"/>

              <application
                  android:allowBackup="false"
                  android:label="VibeChat"
                  android:icon="@drawable/vibechat_logo"
                  android:roundIcon="@drawable/vibechat_logo"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/vibechat/app/MainActivity.java <<'EOF'
          package com.vibechat.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.*;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.view.Window;
          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private WebView webView;
              private PermissionRequest pendingRequest;
              private String[] pendingResources;
              private static final int MEDIA_CODE = 101;
              private static final int NOTIFICATION_CODE = 102;

              private static final String APP_URL =
                  "https://m-elements.github.io/VibeChat/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.BLACK);
                  window.setNavigationBarColor(Color.BLACK);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  webView.setBackgroundColor(Color.BLACK);

                  CookieManager.getInstance()
                      .setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onReceivedSslError(
                          WebView view,
                          SslErrorHandler handler,
                          SslError error
                      ) {
                          handler.cancel();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(
                          PermissionRequest request
                      ) {
                          runOnUiThread(() -> handleMediaPermission(request));
                      }

                      @Override
                      public void onPermissionRequestCanceled(
                          PermissionRequest request
                      ) {
                          if (pendingRequest == request) {
                              pendingRequest = null;
                              pendingResources = null;
                          }
                      }
                  });

                  setContentView(webView);

                  webView.loadUrl(APP_URL);

                  requestNotificationPermission();
              }

              private void handleMediaPermission(
                  PermissionRequest request
              ) {
                  Uri origin = request.getOrigin();

                  if (origin == null ||
                      !"https".equals(origin.getScheme()) ||
                      !"m-elements.github.io".equals(origin.getHost())) {
                      request.deny();
                      return;
                  }

                  if (pendingRequest != null) {
                      request.deny();
                      return;
                  }

                  ArrayList<String> androidPermissions =
                      new ArrayList<>();

                  ArrayList<String> resources =
                      new ArrayList<>();

                  for (String resource : request.getResources()) {

                      if (resource.equals(
                          PermissionRequest.RESOURCE_VIDEO_CAPTURE)) {

                          resources.add(resource);

                          if (checkSelfPermission(
                              Manifest.permission.CAMERA
                          ) != PackageManager.PERMISSION_GRANTED) {
                              androidPermissions.add(
                                  Manifest.permission.CAMERA
                              );
                          }

                      } else if (resource.equals(
                          PermissionRequest.RESOURCE_AUDIO_CAPTURE)) {

                          resources.add(resource);

                          if (checkSelfPermission(
                              Manifest.permission.RECORD_AUDIO
                          ) != PackageManager.PERMISSION_GRANTED) {
                              androidPermissions.add(
                                  Manifest.permission.RECORD_AUDIO
                              );
                          }

                      } else {
                          request.deny();
                          return;
                      }
                  }

                  if (resources.isEmpty()) {
                      request.deny();
                      return;
                  }

                  String[] allowedResources =
                      resources.toArray(new String[0]);

                  if (androidPermissions.isEmpty()) {
                      request.grant(allowedResources);
                      return;
                  }

                  pendingRequest = request;
                  pendingResources = allowedResources;

                  requestPermissions(
                      androidPermissions.toArray(new String[0]),
                      MEDIA_CODE
                  );
              }

              private void requestNotificationPermission() {
                  if (android.os.Build.VERSION.SDK_INT >= 33) {

                      if (checkSelfPermission(
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED) {

                          requestPermissions(
                              new String[]{
                                  Manifest.permission.POST_NOTIFICATIONS
                              },
                              NOTIFICATION_CODE
                          );
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == MEDIA_CODE &&
                      pendingRequest != null) {

                      boolean granted = true;

                      for (String resource : pendingResources) {

                          if (resource.equals(
                              PermissionRequest.RESOURCE_VIDEO_CAPTURE) &&
                              checkSelfPermission(
                                  Manifest.permission.CAMERA
                              ) != PackageManager.PERMISSION_GRANTED) {
                              granted = false;
                          }

                          if (resource.equals(
                              PermissionRequest.RESOURCE_AUDIO_CAPTURE) &&
                              checkSelfPermission(
                                  Manifest.permission.RECORD_AUDIO
                              ) != PackageManager.PERMISSION_GRANTED) {
                              granted = false;
                          }
                      }

                      if (granted) {
                          pendingRequest.grant(pendingResources);
                      } else {
                          pendingRequest.deny();
                      }

                      pendingRequest = null;
                      pendingResources = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) {
                      webView.onPause();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.onResume();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          for attempt in 1 2 3
          do
            gradle assembleDebug --no-daemon --stacktrace --refresh-dependencies && exit 0
            sleep 15
          done
          exit 1

      - name: Upload VibeChat APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
