name: Build VibeChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java & Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android WebView project with custom icon & permissions
        run: |
          mkdir -p android-project/app/src/main/java/com/vibechat/app \
                   android-project/app/src/main/res/values \
                   android-project/app/src/main/res/mipmap-mdpi \
                   android-project/app/src/main/res/mipmap-hdpi \
                   android-project/app/src/main/res/mipmap-xhdpi \
                   android-project/app/src/main/res/mipmap-xxhdpi \
                   android-project/app/src/main/res/mipmap-xxxhdpi

          if [ -f "1795404380602.png" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp "1795404380602.png" "android-project/app/src/main/res/$dir/ic_launcher.png"
              cp "1795404380602.png" "android-project/app/src/main/res/$dir/ic_launcher_round.png"
            done
          fi

          cat << 'EOF' > android-project/build.gradle
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android-project/settings.gradle
          rootProject.name = 'VibeChat'
          include ':app'
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins { id 'com.android.application' }
          android {
            namespace 'com.vibechat.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.vibechat.app'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes {
              release { minifyEnabled false }
              debug { }
            }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources><string name="app_name">VibeChat</string></resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <application
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/vibechat/app/MainActivity.java
          package com.vibechat.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                String[] perms = {Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO};
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED ||
                    ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                  ActivityCompat.requestPermissions(this, perms, 101);
                }
              }
              webView = new WebView(this);
              setContentView(webView);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setMediaPlaybackRequiresUserGesture(false);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(() -> request.grant(request.getResources()));
                }
              });
              webView.loadUrl("https://m-elements.github.io/vibechat/");
            }
          }
          EOF

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibechat-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          
